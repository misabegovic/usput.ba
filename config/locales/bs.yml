      područjima (snimak 2024). Prazna ćelija znači samo da za taj komad terena nema evidentiranih područja
      — NIKAKO da je teren siguran; postoje i neobilježena i neevidentirana polja.
    awareness: 'U stvarnosti nema druge šanse — provjeri prije svakog koraka. Ova stranica ni na koji
      način ne služi procjeni stvarne sigurnosti terena. Za stvarne informacije: BHMAC (bhmac.org, 033/253-800)
      i službena aplikacija „BH Mine Suspected Areas“.'
