      title: Mjerodavno pravo
      text1: Ovi uvjeti korištenja podliježu zakonima Republike Austrije.
      text2: Za rješavanje sporova nadležni su sudovi u Austriji, osim ako obavezujuće odredbe potrošačkog
        prava ne odrede drugačije.
