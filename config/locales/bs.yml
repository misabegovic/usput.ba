      prohibited3: Spam ili neželjena reklama
      prohibited4: Sadržaj koji krši autorska prava
    ip:
      title: Intelektualno vlasništvo
      text1: Sav sadržaj na ovoj web stranici (uključujući tekst, grafiku, logotipe, ikone, slike i softver)
        je vlasništvo Usput ili naših davatelja licenci i zaštićen je zakonima o autorskim pravima.
      text2: Nije dozvoljeno kopiranje, distribucija, modifikacija ili kreiranje izvedenih djela bez našeg
        izričitog pisanog odobrenja.
    disclaimer:
      title: Odricanje odgovornosti
      text1: Usluga se pruža "kakva jest" bez ikakvih garancija, izričitih ili impliciranih.
      text2: 'Ne garantujemo:'
      item1: Neprekidnu ili sigurnu dostupnost usluge
      item2: Tačnost ili potpunost informacija o lokacijama i iskustvima
      item3: Da će usluga ispuniti vaše specifične potrebe
      text3: Koristite informacije na vlastitu odgovornost. Uvijek provjerite informacije kod službenih
        izvora prije putovanja.
