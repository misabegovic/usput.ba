# This file configures Herb for your project and team.
# Settings here take precedence over individual editor preferences.
#
# Herb is a suite of tools for HTML+ERB templates including:
# - Linter: Validates templates and enforces best practices
# - Formatter: Auto-formats templates with intelligent indentation
# - Language Server: Provides IDE support (VS Code, Zed, Neovim, etc.)
#
# Website: https://herb-tools.dev
# Configuration: https://herb-tools.dev/configuration
# GitHub Repo: https://github.com/marcoroth/herb
#

version: 0.11.0

# # Framework and template engine configuration
#
# # Options: ruby | actionview | hanami | sinatra (default: ruby)
framework: actionview
#
# # Options: erubi | erb | herb (default: erubi)
# template_engine: erubi

# files:
#   # Additional patterns beyond the defaults (**.html, **.rhtml, **.html.erb, etc.)
#   include:
#     - '**/*.xml.erb'
#     - 'custom/**/*.html'
#
#   # Patterns to exclude (can exclude defaults too)
#   exclude:
#     - 'public/**/*'
#     - 'tmp/**/*'

# engine:
#   validators:
#     security: true       # default: true
#     nesting: true        # default: true
#     accessibility: true  # default: true

linter:
  enabled: true

  # # Exit with error code when diagnostics of this severity or higher are present
  # # Valid values: error (default), warning, info, hint
  # failLevel: warning

  # # Only report diagnostics of this severity or higher
  # # Affects the CLI output only: lower-severity offenses are still counted in the
  # # summary and still show up in your editor, they just aren't printed or
  # # annotated in CI. Valid values: error, warning, info, hint (default)
  # logLevel: warning

  # # Additional patterns beyond the defaults for linting
  # include:
  #   - '**/*.xml.erb'
  #
  # Templates under app/ only, as erb_lint linted before; public/ holds static pages.
  exclude:
    - 'public/**/*'

  # Rules turned off, each with the reason. Everything else Herb 0.11 ships is on.
  rules:
    # False positive: a form rendered inside `render layout: "users/card" do`
    # is read as nested, though the card holds no form.
    html-no-nested-forms:
      enabled: false
    # False positive: the moment card body renders a link only when
    # `linked: true`, and the call site inside a link passes no `linked`.
    html-no-nested-links:
      enabled: false
    # The four `href="#"` links are placeholders whose address a Stimulus
    # controller sets (mine check, plan viewer, photo gallery).
    html-anchor-require-href:
      enabled: false
    # `tag.attributes(...)` is Rails' helper for attributes in an open tag, and
    # `<%= "checked" if ... %>` toggles one; both are used on purpose.
    erb-no-output-in-attribute-name:
      enabled: false
    # Style: a collection render changes the locals a partial sees, so moving
    # to it is a refactor of its own, not part of adopting the linter.
    actionview-prefer-collection-render:
      enabled: false

  # rules:
  #   # The 'all' pseudo rule sets the default for every rule you don't list.
  #   #   false: start from an empty set and opt back in explicitly
  #   #   true:  start from every rule, including the ones off by default
  #   all:
  #     enabled: false
  #
  #   erb-no-extra-newline:
  #     enabled: false
  #
  #   # Rules can have 'include', 'only', and 'exclude' patterns
  #   some-rule:
  #     # Additional patterns to check (additive, ignored when 'only' is present)
  #     include:
  #       - 'app/components/**/*'
  #     # Don't apply this rule to files matching these patterns
  #     exclude:
  #       - 'app/views/admin/**/*'
  #
  #   another-rule:
  #     # Only apply this rule to files matching these patterns (overrides all 'include')
  #     only:
  #       - 'app/views/**/*'
  #     # Exclude still applies even with 'only'
  #     exclude:
  #       - 'app/views/admin/**/*'

formatter:
  enabled: false
  indentWidth: 2
  indentStyle: space
  maxLineLength: 80

  # # Additional patterns beyond the defaults for formatting
  # include:
  #   - '**/*.xml.erb'
  #
  # # Patterns to exclude from formatting
  # exclude:
  #   - 'app/views/admin/**/*'

  # # Rewriters modify templates during formatting
  # rewriter:
  #   # Pre-format rewriters (modify AST before formatting)
  #   pre:
  #     - tailwind-class-sorter
  #   # Post-format rewriters (modify formatted output string)
  #   post: []
