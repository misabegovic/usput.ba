# `layered` was bound by enola:install and is left out on purpose: usput is a
# Rails app whose controllers use models directly (129 breaches on
# 2026-10-14), so the recipe describes an architecture usput does not follow.
# usput's own laws are in usput.rb.
use_recipe:
  - recipe: ruby-conventions
    as: ruby-conventions
    bind:
      code: { match: ["app/**"] }

